<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Library - Aniverse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="anime-cards.css">
</head>
<body>

    <header class="site-header">
        <div class="header-content">
            <h1><a href="../index.html">Aniverse</a></h1>
        </div>
    </header>

    <main class="page-content">
        
        <div class="filter-controls">
            <form id="search-form" class="search-bar">
                <input type="search" id="search-input" placeholder="Search for any anime...">
                <button type="submit">Search</button>
            </form>

            <div class="genre-filter">
                <select id="genre-select" aria-label="Filter by genre">
                    <option value="all">All Genres</option>
                    </select>
            </div>
        </div>

        <h2 id="page-heading">Most Popular Anime</h2>
        <div id="anime-card-grid">
            <p class="loading-text">Loading popular anime...</p>
        </div>
    </main>

    <div id="anime-modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true" tabindex="-1">
        <div class="modal-content">
            <button id="modal-close-btn" class="modal-close">✕</button>
            <div id="modal-content-inner">
                <p class="loading-text">Loading details...</p>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2025 Anime World. All rights reserved.</p>
    </footer>

    <script src="anime-cards.js"></script>
</body>
</html>
