<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime World Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="homescreen.css">
</head>
<body class="template-default">
    <header class="site-header">
        <div class="header-content">
            <h1>Aniverse</h1>
            <div class="template-select-wrap">
                <label for="template-selector" class="template-selector">Theme:</label>
                <select id="template-selector" aria-label="Template selector">
                    <option value="template-default" selected>Default</option>
                    <option value="template-sakura-pink">Sakura Pink</option>
                    <option value="template-one-piece">One Piece</option>
                    <option value="template-jujutsu-kaisen">Jujutsu Kaisen</option>
                    <option value="template-demon-slayer">Demon Slayer</option>
                    <option value="template-mount-fuji">Mount Fuji</option>
                </select>
            </div>
        </div>
    </header>

    <div id="homescreen-container">
        
        <div class="homescreen-left">
            <a href="Anime_Tasker/task-planner.html" class="tile">
                <h3>Task Planner</h3>
            </a>
            <a href="Anime_Library/anime-cards.html" class="tile">
                <h3>Anime Library</h3>
            </a>
            <a href="#" class="tile coming-soon">
                <h3>Otaku Music</h3>
                <span>(Coming Soon)</span>
            </a>
            <a href="#" class="tile coming-soon">
                <h3>Mini-Games</h3>
                <span>(Coming Soon)</span>
            </a>
        </div>
        
        <div class="homescreen-right">
            <div class="right-panel-tabs" role="tablist">
                <button type="button" class="tab active" data-tab="top" role="tab" aria-selected="true">Top Anime</button>
                <button type="button" class="tab" data-tab="mylist" role="tab" aria-selected="false">My List</button>
            </div>
            <div class="tab-panel active" id="tab-top" role="tabpanel">
                <div class="anime-list" id="anime-list-container">
                    <p class="loading-text">Loading top anime...</p>
                </div>
            </div>
            <div class="tab-panel" id="tab-mylist" role="tabpanel">
                <div id="my-list-container">
                    <p class="loading-text">Loading your list...</p>
                </div>
            </div>
        </div>

    </div>

    <footer>
        <p>© 2025 Anime World. All rights reserved.</p>
    </footer>

    <script src="homescreen.js"></script>
</body>
</html>
